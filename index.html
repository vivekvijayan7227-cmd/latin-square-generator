<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latin Square Puzzle</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>Deductive Logical Puzzle</h1>
        </header>

        <!-- Home Screen / Welcome -->
        <div id="home-screen" class="home-cover">
            <div class="welcome-content">
                <h2>Ready to test your logic?</h2>
                <p>Solve as many puzzles as you can in 5 minutes!</p>
                <button id="btn-start-game" class="action-btn primary large">Start Puzzle</button>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="home-cover" style="display: none;">
            <div class="welcome-content">
                <h2>Time's Up!</h2>

                <div class="results-list">
                    <div class="result-row">
                        <span class="res-label">Number of Puzzles Attempted:</span>
                        <span class="res-value" id="res-attempted">0</span>
                    </div>
                    <div class="result-row">
                        <span class="res-label">Solved Correctly:</span>
                        <span class="res-value" id="res-correct">0</span>
                    </div>
                    <div class="result-row">
                        <span class="res-label">Accuracy:</span>
                        <span class="res-value" id="res-accuracy">0%</span>
                    </div>
                </div>

                <div class="stats-grid" style="display:none;">
                    <!-- Hidden legacy grid, replaced by list above -->
                </div>

                <button id="btn-start-review" class="action-btn primary large">Review Puzzles</button>
            </div>
        </div>

        <main id="game-area" style="display: none;">
            <div id="grid-container" class="grid-board">
                <!-- Grid items generated by JS -->
            </div>

            <div id="palette-container" class="palette-bar">
                <!-- Shape buttons generated by JS -->
            </div>
        </main>

        <footer id="game-footer" style="display: none;">
            <div id="status-message" class="status-msg">Loading...</div>
            <div class="footer-actions">
                <button id="btn-show-answer" class="action-btn secondary" style="display: none;">Show Solution</button>
            </div>

            <!-- Review Controls -->
            <div id="review-controls" class="footer-actions" style="display: none;">
                <button id="btn-prev" class="action-btn secondary">Previous</button>
                <span id="review-status" class="status-msg" style="margin: 0 10px; font-size: 0.9rem;">Puzzle 1/1</span>
                <button id="btn-next" class="action-btn secondary">Next</button>
            </div>
        </footer>
    </div>

    <!-- Stats Display -->
    <div id="game-stats" class="game-stats" style="display: none;">
        <div class="stat-box">
            <span class="label">TIME</span>
            <span id="timer-display" class="value">05:00</span>
        </div>
        <div class="stat-box">
            <span class="label">ATTEMPTED</span>
            <span id="attempted-display" class="value">0</span>
        </div>
        <div class="stat-box">
            <span class="label">SCORE</span>
            <span id="score-display" class="value">0</span>
        </div>
    </div>

    <script src="js/html2canvas.min.js"></script>
    <script src="js/jszip.min.js"></script>
    <script src="js/generator.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
